pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact
    ruff:
      glob: "backend/**/*.py"
      run: cd backend && uv run ruff check . && uv run ruff format --check .
    ty:
      glob: "backend/**/*.py"
      run: cd backend && uv run ty check
    biome:
      glob: "frontend/**/*.{ts,tsx,json}"
      run: cd frontend && pnpm exec biome check .
    tsc:
      glob: "frontend/**/*.{ts,tsx}"
      run: cd frontend && pnpm exec tsc --noEmit
